<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Divine Grant Issuance | CodexChain Treasury</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <header>
    <h1>💰 Divine Grant Issuance</h1>
    <p>Issue sacred grants from the Borders Sovereign Coin (BSC) Treasury</p>
  </header>

  <main>
    <section>
      <form id="grantForm">
        <label>Recipient Name:<br/><input type="text" name="recipient" required /></label><br/><br/>
        <label>Grant Purpose:<br/><input type="text" name="purpose" required /></label><br/><br/>
        <label>Amount (BSC):<br/><input type="number" name="amount" step="0.01" required /></label><br/><br/>
        <label>Issuing Trustee:<br/><input type="text" name="issuer" required /></label><br/><br/>
        <button type="submit">Generate Grant Scroll</button>
      </form>

      <pre id="output" style="margin-top:2rem; background:#fff; padding:1rem; border:1px solid #ccc;"></pre>
    </section>
  </main>

  <footer>
    &copy; 2026 Borders Ecclesia Earth Trust · All rights reserved under divine, sovereign, and ecclesiastical law.
  </footer>

  <script>
    document.getElementById('grantForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const recipient = form.recipient.value;
      const purpose = form.purpose.value;
      const amount = form.amount.value;
      const issuer = form.issuer.value;
      const date = new Date().toISOString().split('T')[0];

      const scroll = `
# 🕊️ Divine Grant Scroll

**Date Issued**: ${date}  
**Recipient**: ${recipient}  
**Purpose**: ${purpose}  
**Amount**: ${amount} BSC  
**Issued By**: ${issuer}  
**Authority**: Borders Dynasty Ecclesia Earth Trust – Sacred Treasury

> “Let this grant be a vessel of divine provision, sealed in honor and executed in faith.”

**Red Thumbprint Seal**: 🟥  
      `.trim();

      document.getElementById('output').textContent = scroll;
    });
  </script>
</body>
</html>
