<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omega Portal – Login</title>
  <link rel="stylesheet" href="omega.css">
</head>
<body class="omega-login-page">
  <div class="omega-login-box">
    <div class="omega-logo">☩</div>
    <h1>Omega Portal</h1>
    <p class="omega-login-sub">Borders Dynasty Command Center</p>
    <form id="loginForm">
      <div class="omega-field">
        <label for="password">Access Code</label>
        <input type="password" id="password" placeholder="Enter access code" autocomplete="current-password" />
      </div>
      <p id="loginError" class="omega-error" style="display:none;">Incorrect access code. Try again.</p>
      <button type="submit" class="omega-btn">Enter Portal</button>
    </form>
  </div>
  <script>
    const STORAGE_KEY = "omega_auth";
    if (localStorage.getItem(STORAGE_KEY) === "true") {
      window.location.href = "dashboard.html";
    }
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const pw = document.getElementById("password").value;
      if (pw === "Devenity1008") {
        localStorage.setItem(STORAGE_KEY, "true");
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("loginError").style.display = "block";
      }
    });
  </script>
</body>
</html>
